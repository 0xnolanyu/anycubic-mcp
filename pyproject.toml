[project]
name = "anycubic-mcp"
version = "0.1.0"
description = "Unofficial Anycubic cloud 3D printer MCP server: send print jobs, camera vision bed-check, cloud queue, print history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "anycubic-mcp contributors" }]
keywords = ["anycubic", "kobra", "3d-printing", "mcp", "model-context-protocol", "cloud", "camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
]

[project.scripts]
anycubic-mcp = "anycubic_mcp.server:main"
anycubic-setup = "anycubic_mcp.setup:main"

[project.urls]
Homepage = "https://github.com/USER/anycubic-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anycubic_mcp"]
